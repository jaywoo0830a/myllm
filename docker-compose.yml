# myLLM Script Runner API — Docker Compose
#
# 사용법
#   docker compose -f docker-compose.yml up --build -d
#   curl http://localhost:8000/health
#   curl -X POST http://localhost:8000/v1/run \
#        -H 'Content-Type: application/json' \
#        -d '{"action":"status"}'
#
# 보안
#   - EXTERNAL_TOKEN 을 설정하면 `Authorization: Bearer <token>` 이 필수.
#   - 저장소 server/scripts 를 읽기-전용으로 마운트해 화이트리스트 셸 스크립트 실행.
#   - 임의 명령 주입은 allowlist(화이트리스트)가 차단.

services:
  script-runner-api:
    build:
      context: .
      dockerfile: scripts/api/Dockerfile
    image: myllm-script-runner:latest
    container_name: myllm-script-runner
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      # API 가 server/scripts/*.sh 를 실행할 수 있도록 저장소를 마운트
      - ./server/scripts:/myllm/server/scripts:ro
      - ./server/run:/myllm/server/run:rw    # PID/로그 디렉토리 (스크립트가 mkdir/write)
      - ./server/config:/myllm/server/config:ro  # 환경변수(base env + 모델 env) 공유
      - ./model_registry.py:/myllm/model_registry.py:ro
    environment:
      - PYTHONPATH=/myllm
      - MYLLM_SCRIPTS_DIR=/myllm/server/scripts
      - EXTERNAL_TOKEN=${EXTERNAL_TOKEN:-}
      - MYLLM_CMD_TIMEOUT=${MYLLM_CMD_TIMEOUT:-180}
      - API_PORT=${API_PORT:-8000}
    restart: unless-stopped
    # NOTE: read_only:true 는 제거한다 — 컨테이너가 /tmp 에 상태 파일을 쓰고
    #       server/run(마운트됨) 에 PID/로그를 기록해야 한다.
    #       보안은 (1)화이트리스트 (2)scripts:ro (3)EXTERNAL_TOKEN 으로 확보한다.

networks:
  default:
    name: myllm-net
    driver: bridge